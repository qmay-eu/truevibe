<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TrueVibe unsupported region</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Liquid glass effect – matching main app */
        :root {
            --bg: rgba(248, 250, 252, 0.85);
            --card: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.5);
            --text: #1e2a3a;
            --text-secondary: #5b6e8c;
            --border: rgba(0, 0, 0, 0.08);
            --accent: #1d9bf0;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
            --backdrop-blur: blur(12px);
        }

        body.dark {
            --bg: rgba(10, 12, 16, 0.9);
            --card: rgba(22, 24, 28, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text: #e7e9ea;
            --text-secondary: #8b9ab0;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #1d9bf0;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgba(29,155,240,0.05), rgba(139,92,246,0.02)), var(--bg);
            background-color: var(--bg);
            backdrop-filter: var(--backdrop-blur);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--card);
            backdrop-filter: var(--backdrop-blur);
            border-radius: 48px;
            padding: 48px 32px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            text-align: center;
            transition: 0.2s;
        }

        .icon {
            font-size: 4.5rem;
            margin-bottom: 24px;
            display: inline-block;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--card-border);
            color: #e74c3c;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }

        .message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .action-btn {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border: 1px solid var(--card-border);
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: 0.1s;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            text-align: center;
        }

        .action-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: scale(0.98);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text);
            z-index: 100;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: white;
        }

        @media (max-width: 500px) {
            .glass-card { padding: 32px 24px; }
            .icon { width: 85px; height: 85px; font-size: 3rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle">🌙</button>
    <div class="container">
        <div class="glass-card">
            <div class="icon">🚫</div>
            <h1>Unsupported region</h1>
            <div class="message">
                This website isn't avalaible in your region.<br>
                We are really sorry.
            </div>
            <div class="buttons">
                <a href="https://yeah.qmay.eu/help.html" class="action-btn" target="_blank" rel="noopener noreferrer">
                   💬 Contact us
                </a>
                <a href="tips.html" class="action-btn">
                    💡 What can I do?
                </a>
            </div>
        </div>
    </div>

    <script>
        // Dark mode toggle (persistent)
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = (theme) => {
            if (theme === 'dark') {
                document.body.classList.add('dark');
                themeToggle.innerText = '☀️';
            } else {
                document.body.classList.remove('dark');
                themeToggle.innerText = '🌙';
            }
            localStorage.setItem('blockedTheme', theme);
        };
        const savedTheme = localStorage.getItem('blockedTheme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(savedTheme);
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        });
    </script>
</body>
</html>
