dekompiláciu, disassembláciu alebo pokus o získanie zdrojového kódu.","Modifikovať, upravovať, prekladať alebo zasahovať do integrity softvéru.","Odstraňovať, zakrývať alebo meniť akékoľvek označenia o autorských právach, ochranných známkach alebo vlastníctve.","Používať softvér ako súčasť služby SaaS, PaaS, hostingového riešenia alebo platformy pre tretie strany bez výslovného súhlasu.","Obchádzať akékoľvek technické ochranné opatrenia alebo licenčné mechanizmy implementované v softvéri."],after:"Porušenie ktoréhokoľvek z týchto bodov sa považuje za podstatné porušenie zmluvy a zakladá nárok na okamžité ukončenie licencie a náhradu škody."},{id:"ukoncenie",num:"04",title:"UKONČENIE PLATNOSTI",content:["Táto zmluva je účinná odo dňa vašej prvej inštalácie alebo použitia softvéru a zostáva v platnosti až do jej ukončenia v súlade s jej podmienkami.","Vaše práva vyplývajúce z tejto licencie automaticky a s okamžitou platnosťou zanikajú bez nutnosti upozornenia, ak porušíte akékoľvek ustanovenie tejto zmluvy.","Po ukončení platnosti ste povinní okamžite prestať používať softvér, odinštalovať všetky jeho kópie zo svojich zariadení a trvalo odstrániť alebo zničiť všetky kópie, vrátane záložných kópií a súvisiacej dokumentácie, ktoré máte v držbe.","Ustanovenia o vlastníctve, vylúčení záruk, obmedzení zodpovednosti a rozhodnom práve zostávajú v platnosti aj po ukončení tejto zmluvy."]},{id:"zaruky",num:"05",title:"VYLÚČENIE ZÁRUK",content:["Softvér je poskytovaný v stave „AKO STOJÍ A LEŽÍ“ (AS IS) a „AKO JE DOSTUPNÝ“ (AS AVAILABLE), bez akýchkoľvek záruk akéhokoľvek druhu, výslovných alebo implicitných.","V maximálnom rozsahu povolenom platnými právnymi predpismi autor výslovne vylučuje všetky záruky, vrátane, ale nie výlučne, implicitných záruk predajnosti, vhodnosti na konkrétny účel, neporušovania práv tretích strán, presnosti, spoľahlivosti a nerušenej prevádzky.","Autor nezaručuje, že softvér splní vaše požiadavky, bude fungovať bez prerušenia, chýb alebo že všetky chyby budú opravené. Nesiete plnú zodpovednosť za výber softvéru na dosiahnutie zamýšľaných výsledkov a za jeho inštaláciu, používanie a dosiahnuté výsledky."]},{id:"zodpovednost",num:"06",title:"OBMEDZENIE ZODPOVEDNOSTI",content:["V maximálnom rozsahu povolenom platnými právnymi predpismi nebude autor, v žiadnom prípade, zodpovedný za žiadne priame, nepriame, náhodné, následné, špeciálne, trestné alebo exemplárne škody.","Toto obmedzenie sa vzťahuje najmä, ale nie výlučne, na stratu zisku, stratu dát, prerušenie podnikania, stratu goodwill, náklady na obstaranie náhradného tovaru alebo služieb, bez ohľadu na teóriu zodpovednosti (zmluva, delikt, nedbanlivosť alebo iná), a to aj v prípade, že bol autor upozornený na možnosť vzniku takýchto škôd.","V jurisdikciách, ktoré neumožňujú vylúčenie alebo obmedzenie zodpovednosti za náhodné alebo následné škody, sa vyššie uvedené obmedzenia nemusia na vás vzťahovať v plnom rozsahu. V takom prípade bude zodpovednosť autora obmedzená na minimálnu sumu povolenú zákonom."]},{id:"pravo",num:"07",title:"ROZHODNÉ PRÁVO A JURISDIKCIA",content:["Táto zmluva sa riadi, vykladá a posudzuje v súlade s právnym poriadkom Slovenskej republiky, bez ohľadu na jej kolízne normy.","Akékoľvek spory, nároky alebo rozpory vyplývajúce z tejto zmluvy alebo v súvislosti s ňou, vrátane sporov týkajúcich sa jej existencie, platnosti alebo ukončenia, budú predložené na rozhodnutie vecne a miestne príslušným súdom Slovenskej republiky so sídlom v Bratislave.","Ak sa akékoľvek ustanovenie tejto zmluvy ukáže ako nevymáhateľné alebo neplatné, takéto ustanovenie bude vykladané alebo upravené v minimálnom nevyhnutnom rozsahu tak, aby bolo vymáhateľné, pričom ostatné ustanovenia zostávajú v plnej platnosti a účinnosti."]}];function bu(){let[e,n]=hn.useState("predmet"),[t,r]=hn.useState(0),[l,o]=hn.useState(!1),u=hn.useRef(null),i=t>0;hn.useEffect(()=>{let p=Tl.map((m)=>document.getElementById(m.id)).filter(Boolean);return u.current=new IntersectionObserver((m)=
